<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Belagutti Village Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16231d;
  --ink-soft:#5d6d64;
  --paper:#fbf8f0;
  --card:#ffffff;
  --leaf:#1f6b4a;
  --leaf-dark:#14503697;
  --turmeric:#f0a81b;
  --chilli:#c4382c;
  --line:#e6e1d4;
  --radius:16px;
  --shadow:0 4px 18px rgba(22,35,29,.08);
  --head:'Poppins','Noto Sans Kannada',system-ui,sans-serif;
  --body:'Noto Sans Kannada','Poppins',system-ui,sans-serif;
  --hdr-h:58px;
}
:root:not([data-theme="light"]){color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr-h) + 72px)}
body{
  margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);
  -webkit-tap-highlight-color:transparent;
}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;width:100%}
:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px;border-radius:6px}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:60;height:var(--hdr-h);
  background:var(--leaf);color:#fff;
  display:flex;align-items:center;gap:12px;padding:0 14px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);
}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:700;font-size:17px;letter-spacing:-.2px;margin-right:auto}
.brand .dot{width:28px;height:28px;border-radius:9px;background:var(--turmeric);display:grid;place-items:center;font-size:15px}
nav.desk{display:none;gap:4px}
nav.desk a{color:#fff;text-decoration:none;font-size:13.5px;font-weight:500;padding:7px 10px;border-radius:8px}
nav.desk a:hover{background:rgba(255,255,255,.14)}
.lang{
  display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:3px;gap:2px;flex:none;
}
.lang button{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:#fff;opacity:.75}
.lang button.on{background:#fff;color:var(--leaf);opacity:1}
.burger{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);font-size:18px}
@media(min-width:1000px){
  .burger{display:none}
  nav.desk{display:flex}
}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.55);opacity:0;pointer-events:none;transition:.25s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(82vw,320px);background:var(--card);z-index:90;
  transform:translateX(105%);transition:transform .28s cubic-bezier(.3,.8,.4,1);
  display:flex;flex-direction:column;padding:16px 14px;overflow-y:auto;
}
.drawer.on{transform:none}
.drawer h4{margin:0 0 14px;font-family:var(--head);font-size:15px;display:flex;justify-content:space-between;align-items:center}
.drawer a{
  display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;
  text-decoration:none;color:var(--ink);font-weight:500;font-size:15px;border:1px solid var(--line);margin-bottom:8px;
}
.drawer a .ic{font-size:19px}
.drawer a:active{background:#f2f7f4}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;background:#123a2a}
.slides{display:flex;transition:transform .6s cubic-bezier(.4,.8,.3,1)}
.slide{min-width:100%;height:230px;position:relative;display:grid;place-items:center}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,26,18,.25),rgba(8,26,18,.82))}
.slide .cap{position:relative;text-align:center;color:#fff;padding:0 24px;max-width:620px;z-index:2}
.slide .cap b{display:block;font-family:var(--head);font-size:clamp(20px,5.5vw,34px);line-height:1.15;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.slide .cap span{display:block;margin-top:8px;font-size:13.5px;opacity:.92}
.slide .art{position:relative;z-index:2;font-size:52px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.dots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.45);transition:.3s}
.dots i.on{background:#fff;width:20px}
@media(min-width:760px){.slide{height:340px}}

/* ---------- Search bar ---------- */
.finder{
  position:sticky;top:var(--hdr-h);z-index:50;background:var(--paper);
  padding:12px 14px;border-bottom:1px solid var(--line);
}
.finder .row{display:flex;gap:8px;max-width:1100px;margin:0 auto}
.field{position:relative;flex:1}
.field .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.55}
.field input,.field select{
  padding:12px 12px 12px 36px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--ink);appearance:none;
}
.field.loc{flex:0 0 150px}
@media(max-width:560px){
  .finder .row{flex-direction:column}
  .field.loc{flex:auto}
}
.results{max-width:1100px;margin:10px auto 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-size:13px;
  display:flex;align-items:center;gap:6px;
}
.chip.crop{background:#f2f8f4;border-color:#cfe4d8;color:#15533a;font-weight:500}
.hint{font-size:12.5px;color:var(--ink-soft);margin:0 0 7px}
.hit{
  display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:9px 11px;margin-bottom:7px;width:100%;text-align:left;
}
.hit .em{font-size:20px}
.hit b{font-size:14px;font-weight:600}
.hit small{display:block;color:var(--ink-soft);font-size:12px}
.hit .go{margin-left:auto;color:var(--leaf);font-size:18px}

.flist{display:flex;flex-direction:column;gap:10px;margin-bottom:4px}
.frow{
  display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:10px;box-shadow:var(--shadow);
}
.frow .thumb{width:74px;height:74px;flex:none;border-radius:12px;font-size:24px}
.frow .fbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.frow .fbody b{font-size:14.5px;font-weight:600;line-height:1.25}
.frow .fbody .who{font-size:12.5px;color:var(--ink-soft)}
.frow .fbody .loc{font-size:12px;color:var(--ink-soft)}
.frow .fbody .price{font-size:13px;font-weight:600;color:var(--leaf)}
.frow .actions{display:flex;gap:8px;margin-top:7px}
.frow .actions .btn{width:auto;padding:9px 14px;font-size:13px}
@media(max-width:420px){
  .frow{flex-wrap:wrap}
  .frow .actions{width:100%}
  .frow .actions .btn{flex:1}
}

/* ---------- Sections ---------- */
main{max-width:1100px;margin:0 auto;padding:6px 14px 40px}
section{padding:22px 0 4px;scroll-margin-top:calc(var(--hdr-h) + 80px)}
.shead{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
.shead h2{font-family:var(--head);font-size:19px;font-weight:700;margin:0;letter-spacing:-.3px}
.shead .badge{font-size:11.5px;background:#f0ece0;color:var(--ink-soft);padding:3px 9px;border-radius:999px;white-space:nowrap}
.sub{margin:0 0 14px;color:var(--ink-soft);font-size:13px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.grid.wide{grid-template-columns:1fr}
@media(min-width:620px){.grid.wide{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.grid.wide{grid-template-columns:repeat(3,1fr)}}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  text-align:left;width:100%;display:flex;flex-direction:column;box-shadow:var(--shadow);
  transition:transform .18s ease;
}
.card:active{transform:scale(.985)}
.thumb{position:relative;aspect-ratio:4/3;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#e8f1ea,#d6e7dc)}
.thumb.a{background:linear-gradient(135deg,#fdeecb,#f6dca0)}
.thumb.b{background:linear-gradient(135deg,#f7dedb,#eec6c1)}
.thumb.c{background:linear-gradient(135deg,#dfe7f6,#c8d6ee)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{
  position:absolute;left:8px;top:8px;z-index:2;background:rgba(255,255,255,.94);color:var(--leaf);
  font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;
}
.cbody{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.cbody b{font-size:14.5px;font-weight:600;line-height:1.25}
.cbody .who{font-size:12.5px;color:var(--ink-soft)}
.cbody .loc{font-size:12px;color:var(--ink-soft);margin-top:auto;padding-top:6px}
.cbody .price{font-size:13px;font-weight:600;color:var(--leaf)}

.empty{
  border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;
  color:var(--ink-soft);font-size:13.5px;background:#fff;
}

.notice{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 15px;
  margin-bottom:10px;box-shadow:var(--shadow);
}
.notice .ndate{font-size:11.5px;color:var(--ink-soft);margin-bottom:5px}
.notice b{font-size:14.5px;font-weight:600;line-height:1.3}
.notice p{margin:6px 0 0;font-size:13.5px;color:var(--ink);line-height:1.65;white-space:pre-wrap}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 16px;border-radius:12px;font-weight:600;font-size:14.5px;width:100%;
}
.btn.wa{background:#1faa54;color:#fff}
.btn.call{background:#fff;color:var(--leaf);border:1.5px solid var(--leaf)}
.btn.map{background:#eef3fb;color:#24457c;border:1.5px solid #cdd9ee}
.btn.solid{background:var(--leaf);color:#fff}
.btn.ghost{background:#f2efe6;color:var(--ink)}
.btn:active{filter:brightness(.95)}
.btnrow{display:flex;gap:9px;margin-top:14px}

/* ---------- Sheet / modal ---------- */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--card);
  border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.3,.8,.4,1);
  padding:0 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.18);
}
.sheet.on{transform:none}
@media(min-width:760px){
  .sheet{
    left:50%;right:auto;bottom:auto;top:50%;width:520px;max-height:86vh;border-radius:20px;
    transform:translate(-50%,-44%) scale(.97);opacity:0;
  }
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
}
.grab{position:sticky;top:0;background:var(--card);padding:10px 0 6px;z-index:3}
.grab .bar{width:42px;height:4px;border-radius:99px;background:#dcd6c8;margin:0 auto}
.sheet h3{font-family:var(--head);font-size:19px;margin:6px 0 2px;letter-spacing:-.3px}
.sheet .meta{color:var(--ink-soft);font-size:13px;margin:0 0 12px}
.closeX{position:absolute;right:12px;top:10px;width:32px;height:32px;border-radius:99px;background:#f1ede3;display:grid;place-items:center;font-size:15px;z-index:4}

.gal{display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin:0 -16px 14px;padding-left:16px;padding-right:16px}
.gal::-webkit-scrollbar{display:none}
.gal .g{flex:0 0 78%;max-width:300px;aspect-ratio:4/3;border-radius:14px;overflow:hidden;scroll-snap-align:center;position:relative;display:grid;place-items:center;font-size:44px}
.gal .g img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.kv{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--ink-soft);flex:0 0 96px;font-size:13px}
.kv b{font-weight:600}
.list{margin:0;padding-left:18px;font-size:14px;line-height:1.75;color:var(--ink)}

label.f{display:block;font-size:12.5px;color:var(--ink-soft);margin:12px 0 5px;font-weight:500}
.inp{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fdfcf8;color:var(--ink)}
.inp:focus{border-color:var(--leaf);background:#fff}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7a8a80 50%),linear-gradient(135deg,#7a8a80 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fdfcf8}
.qty button{width:48px;height:46px;font-size:20px;color:var(--leaf);background:#fff;flex:none}
.qty input{border:none;text-align:center;background:transparent;padding:12px 0}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);font-size:13.5px;font-weight:500;background:#fff}
.seg button.on{border-color:var(--leaf);background:#f1f8f4;color:var(--leaf);font-weight:600}
.note{font-size:12px;color:var(--ink-soft);margin:8px 0 0;line-height:1.5}
.err{color:var(--chilli);font-size:12.5px;margin:8px 0 0;min-height:16px}
.ok{background:#f1f8f4;border:1px solid #cfe4d8;color:#15533a;font-size:12.5px;padding:9px 11px;border-radius:10px;margin-top:8px}

.alert{
  margin-top:12px;background:#fff7e8;border:1.5px solid var(--turmeric);border-radius:14px;
  padding:14px 14px 12px;
}
.alert .ah{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.alert .ah .clip{
  width:36px;height:36px;flex:none;border-radius:10px;background:var(--turmeric);color:#fff;
  display:grid;place-items:center;font-size:18px;
}
.alert .ah .clip.phone{background:var(--leaf)}
.alert .ah b{font-size:14.5px;line-height:1.3}
.alert ol{margin:0 0 10px;padding-left:20px;font-size:13.5px;line-height:1.9;color:var(--ink)}
.alert ol li b{font-weight:700}
.alert .warn{font-size:12px;color:#8a5a12;background:#fdecc8;padding:7px 9px;border-radius:8px;margin-bottom:10px}
.alert .copybtn{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--leaf);
  background:#fff;border:1.5px solid var(--leaf);padding:8px 12px;border-radius:10px;width:100%;justify-content:center;
}

footer{background:#14352a;color:#dfe9e3;text-align:center;padding:26px 16px calc(26px + env(safe-area-inset-bottom));font-size:13px}
footer b{color:#fff;font-family:var(--head)}
footer a{transition:font-weight .15s}
footer a:hover,footer a:focus-visible,footer a:active{font-weight:700}
footer p{margin:5px 0}

@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot">🌾</span><span data-t="brand">ಬೆಳಗುತ್ತಿ ಮಾರುಕಟ್ಟೆ</span></div>
  <nav class="desk" id="deskNav"></nav>
  <div class="lang" role="group" aria-label="Language">
    <button id="btnKn" class="on" onclick="setLang('kn')">ಕನ್ನಡ</button>
    <button id="btnEn" onclick="setLang('en')">EN</button>
  </div>
  <button class="burger" id="burger" onclick="openDrawer()" aria-label="Menu">☰</button>
</header>

<div class="scrim" id="scrim" onclick="closeAll()"></div>
<aside class="drawer" id="drawer" aria-label="Sections">
  <h4><span data-t="menu">ವಿಭಾಗಗಳು</span><button onclick="closeAll()" style="font-size:18px">✕</button></h4>
  <div id="drawerNav"></div>
</aside>

<!-- HERO -->
<div class="hero">
  <div class="slides" id="slides"></div>
  <div class="dots" id="dots"></div>
</div>

<!-- SEARCH -->
<div class="finder">
  <div class="row">
    <div class="field">
      <span class="ic">🔍</span>
      <input id="q" class="inp" oninput="onSearch()" data-t-ph="searchPh" placeholder="">
    </div>
    <div class="field loc">
      <span class="ic">📍</span>
      <select id="loc" class="inp" onchange="onLocation()"></select>
    </div>
  </div>
  <div class="results" id="results"></div>
</div>

<main id="main"></main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <button class="closeX" onclick="closeAll()" aria-label="Close">✕</button>
  <div class="grab"><div class="bar"></div></div>
  <div id="sheetBody"></div>
</div>

<footer>
  <p><b data-t="brand">ಬೆಳಗುತ್ತಿ ಮಾರುಕಟ್ಟೆ</b></p>
  <p data-t="footNote">ರೈತರು, ಅಂಗಡಿಗಳು ಮತ್ತು ಗ್ರಾಹಕರನ್ನು ನೇರವಾಗಿ ಜೋಡಿಸುತ್ತದೆ.</p>
  <p style="opacity:.7">© 2026 · Developed &amp; designed by <a href="https://shashankabcbuilds.in" target="_blank" rel="noopener" style="color:#dfe9e3;text-decoration:underline">Shashanka</a></p>
</footer>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shade = i => ['','a','b','c'][i % 4];

function thumb(item, i, cls){
  return `<div class="thumb ${shade(i)} ${cls||''}">
      <span>${item.e || '📷'}</span>
      ${item.img ? `<img src="${esc(item.img)}" alt="${esc(L(item))}" loading="lazy" onerror="this.remove()">` : ''}
    </div>`;
}
/* 4 scrollable images for a place. If images/name-2.jpg etc. don't exist,
   the coloured tile stays visible — nothing breaks. */
function gallery(item){
  const base = (item.img || '').replace(/\.(jpg|jpeg|png|webp)$/i, '');
  const ext  = (item.img || '').match(/\.(jpg|jpeg|png|webp)$/i)?.[0] || '.jpg';
  let out = '<div class="gal">';
  for (let i = 0; i < 4; i++){
    const src = item.img ? (i === 0 ? item.img : `${base}-${i + 1}${ext}`) : '';
    out += `<div class="g ${shade(i)}"><span>${item.e || '📷'}</span>${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div>`;
  }
  return out + '</div>';
}
const kv = (label, val) => `<div class="kv"><span>${label}</span><b>${val}</b></div>`;
const call = p => { window.location.href = 'tel:+' + p; };

function farmerRow(d, i, kind){
  return `<div class="frow">
    ${thumb(d, i)}
    <div class="fbody">
      <b>${esc(L(d))}</b>
      <span class="who">${t('farmer')}: ${esc(L(d.farmer))}</span>
      <span class="loc">📍 ${vName(d.loc)}</span>

        <button class="btn wa" onclick="openOrder('${kind}',${i})">🟢 ${t('order')}</button>
        <button class="btn call" onclick="call('${d.phone}')">📞 ${t('call')}</button>

    </div>

}

let slideIdx = 0, slideTimer = null;
function buildHero(){
  $('#slides').innerHTML = SLIDES.map((s, i) => {
    const c = lang === 'kn' ? s.kn : s.en;
    return `<div class="slide">
      ${s.img ? `<img src="${esc(s.img)}" alt="" onerror="this.remove()">` : ''}
      <div class="veil"></div>
      <div class="cap"><span class="art">${s.e}</span><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>
    </div>`;
  }).join('');
  $('#dots').innerHTML = SLIDES.map((_, i) => `<i class="${i === slideIdx ? 'on' : ''}"></i>`).join('');
  goSlide(slideIdx);
}
function goSlide(i){
  slideIdx = (i + SLIDES.length) % SLIDES.length;
  $('#slides').style.transform = `translateX(-${slideIdx * 100}%)`;
  $('#dots').querySelectorAll('i').forEach((d, n) => d.classList.toggle('on', n === slideIdx));
}
function startHero(){
  clearInterval(slideTimer);
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  slideTimer = setInterval(() => goSlide(slideIdx + 1), 4000);
}
/* swipe on the hero */
let hx = null;
$('#slides').addEventListener('touchstart', e => { hx = e.touches[0].clientX; clearInterval(slideTimer); }, {passive:true});
$('#slides').addEventListener('touchend', e => {
  if (hx === null) return;
  const d = e.changedTouches[0].clientX - hx;
  if (Math.abs(d) > 40) goSlide(slideIdx + (d < 0 ? 1 : -1));
  hx = null; startHero();
}, {passive:true});

function buildLocations(){

const curLoc = () => $('#loc').value;
const inLoc = x => !curLoc() || x.loc === curLoc();

function onLocation(){ renderAll(); onSearch(); }

/* everything searchable, in one flat index */
function index(){
  const rows = [];
  VEG.forEach((d,i) => rows.push({d, i, kind:'veg', sec:'vegetables', label:t('vegT')}));
  FRUIT.forEach((d,i) => rows.push({d, i, kind:'fruit', sec:'fruits', label:t('fruitT')}));
  STATIONARY.forEach((d,i) => rows.push({d, i, kind:'stat', sec:'stationary', label:t('statT')}));
  HOTELS.forEach((d,i) => rows.push({d, i, kind:'hotel', sec:'hotels', label:t('hotelT')}));
  TEMPLES.forEach((d,i) => rows.push({d, i, kind:'temple', sec:'temples', label:t('templeT')}));
  HOSPITALS.forEach((d,i) => rows.push({d, i, kind:'hosp', sec:'hospital', label:t('hospT')}));
  FARMS.forEach((d,i) => rows.push({d, i, kind:'farm', sec:'farming', label:t('farmT')}));
  return rows;
}

function onSearch(){
  const q = $('#q').value.trim().toLowerCase();
  const box = $('#results');
  const loc = curLoc();

  if (!q){
    /* no search text: if a village is picked, show the crops grown there */
    if (loc){
      const list = CROPS[loc] || [];
      box.innerHTML = `<p class="hint">${t('cropsHere')} · ${vName(loc)}</p>
        <div class="chips">${list.map(c => `<span class="chip crop">${c.e} ${L(c)}</span>`).join('')}</div>`;
    } else box.innerHTML = '';
    return;
  }

  const hits = index().filter(r =>
    (!loc || r.d.loc === loc) &&
    ((r.d.kn + ' ' + r.d.en).toLowerCase().includes(q) ||
     (r.d.farmer ? (r.d.farmer.kn + ' ' + r.d.farmer.en).toLowerCase().includes(q) : false))
  );

  if (!hits.length){ box.innerHTML = `<p class="hint">${t('noResult')}</p>`; return; }

  /* vegetables/fruits: show every matching farmer as a full card with Order + Call */
  const produce = hits.filter(r => r.kind === 'veg' || r.kind === 'fruit');
  /* everything else: compact tappable row that opens the detail sheet */
  const others = hits.filter(r => r.kind !== 'veg' && r.kind !== 'fruit').slice(0, 8);

  let html = '';
  if (produce.length){
    html += `<div class="flist">${produce.map(r => farmerRow(r.d, r.i, r.kind)).join('')}</div>`;
  }
  if (others.length){
    html += others.map(r =>
      `<button class="hit" onclick="openDetail('${r.kind}',${r.i})">
         <span class="em">${r.d.e}</span>
         <span><b>${esc(L(r.d))}</b><small>${r.label} · ${vName(r.d.loc)}</small></span>
         <span class="go">›</span>
       </button>`).join('');
  }
  box.innerHTML = html;
}

let orderCtx = null, geo = null;

function openOrder(kind, i){
  const src = {veg:VEG, fruit:FRUIT, stat:STATIONARY}[kind];
  const d = src[i];
  orderCtx = d; geo = null;
  const redraw = () => openOrder(kind, i);
  const isStat = kind === 'stat';
  const metaLine = isStat
    ? `${esc(L(d))} · 📍 ${vName(d.loc)}`
    : `${esc(L(d))} · ${t('farmer')}: ${esc(L(d.farmer))} · 📍 ${vName(d.loc)}`;
  const itemVal = isStat ? '' : esc(L(d));
  const itemPh  = isStat ? t('itemsPh') : '';
  const qtyLbl  = isStat ? t('qtyGeneric') : t('qty');
  showSheet(`
    <h3>${t('ordTitle')}</h3>
    <p class="meta">${metaLine}</p>

    <label class="f" for="oName">${t('yourName')}</label>
    <input id="oName" class="inp" autocomplete="name">

    <label class="f" for="oPhone">${t('phone')}</label>
    <input id="oPhone" class="inp" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel">

    <label class="f" for="oItem">${t('need')}</label>
    <input id="oItem" class="inp" value="${itemVal}" placeholder="${itemPh}">

    <label class="f">${qtyLbl}</label>
    <div class="qty">
      <button type="button" onclick="bump(-1)" aria-label="minus">−</button>
      <input id="oQty" class="inp" value="1" inputmode="numeric" style="border:none;background:transparent">
      <button type="button" onclick="bump(1)" aria-label="plus">+</button>
    </div>

    <label class="f">${t('delivery')}</label>
    <div class="seg">
      <button type="button" id="segP" class="on" onclick="setMode('pickup')">🛵 ${t('pickup')}</button>
      <button type="button" id="segH" onclick="setMode('home')">🏠 ${t('home')}</button>
    </div>

    <div id="homeBox" style="display:none">
      <label class="f" for="oAddr">${t('addr')}</label>
      <input id="oAddr" class="inp" placeholder="${t('addrPh')}">
      <div style="margin-top:9px"><button class="btn map" type="button" onclick="grabLocation()">📍 ${t('sendLoc')}</button></div>
      <div id="geoOk"></div>
    </div>

    <p class="err" id="oErr"></p>
    <div class="btnrow"><button class="btn wa" onclick="sendOrder()">🟢 ${t('sendWA')}</button></div>
  `, redraw);
}
let mode = 'pickup';
function setMode(m){
  mode = m;
  $('#segP').classList.toggle('on', m === 'pickup');
  $('#segH').classList.toggle('on', m === 'home');
  $('#homeBox').style.display = m === 'home' ? 'block' : 'none';
}
function bump(n){
  const el = $('#oQty');
  el.value = Math.max(1, (parseInt(el.value) || 0) + n);
}
function grabLocation(){
  if (!navigator.geolocation){ $('#oErr').textContent = t('eGeo'); return; }
  navigator.geolocation.getCurrentPosition(
    p => {
      geo = `https://maps.google.com/?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;
      $('#geoOk').innerHTML = `<div class="ok">${t('locCap')}</div>`;
      $('#oErr').textContent = '';
    },
    () => { $('#oErr').textContent = t('eGeo'); },
    {enableHighAccuracy:true, timeout:10000}
  );
}
function sendOrder(){
  const n = $('#oName').value.trim(), p = $('#oPhone').value.trim(),
        it = $('#oItem').value.trim(), q = $('#oQty').value.trim(),
        err = $('#oErr');
  if (!n || !p || !it || !q){ err.textContent = t('eFill'); return; }
  if (!/^[0-9]{10}$/.test(p)){ err.textContent = t('ePhone'); return; }
  if (!/^[0-9]+$/.test(q)){ err.textContent = t('eQty'); return; }

  let addr = '';
  if (mode === 'home'){
    addr = $('#oAddr').value.trim();
    if (!addr && !geo){ err.textContent = t('eAddr'); return; }
  }
  err.textContent = '';

  const lines = [
    '🛒 ' + t('ordTitle'),
    `${t('yourName')}: ${n}`,
    `${t('phone')}: ${p}`,
    `${t('need')}: ${it}`,
    `${t('qty')}: ${q}`,
    `${t('delivery')}: ${mode === 'home' ? t('home') : t('pickup')}`
  ];
  if (mode === 'home'){
    if (addr) lines.push(`${t('addr')}: ${addr}`);
    if (geo)  lines.push(`📍 ${geo}`);
  }
  window.open('https://wa.me/' + orderCtx.phone + '?text=' + encodeURIComponent(lines.join('\n')), '_blank');
}

/* ---- Stationery: send items list or a photo of the list, via WhatsApp ---- */
let statReqPhone = null;
function openStatRequest(i){
  const d = STATIONARY[i];
  statReqPhone = d.phone;
  const redraw = () => openStatRequest(i);
  showSheet(`
    <h3>${t('reqTitle')}</h3>
    <p class="meta">${esc(L(d))} · 📍 ${vName(d.loc)}</p>

    <label class="f" for="sName">${t('yourName')}</label>
    <input id="sName" class="inp" autocomplete="name">

    <label class="f" for="sPhone">${t('phone')}</label>
    <input id="sPhone" class="inp" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel">

    <label class="f" for="sList">${t('itemsList')}</label>
    <textarea id="sList" class="inp" rows="3" style="resize:vertical" placeholder="${t('itemsListPh')}"></textarea>

    <label class="f">${t('orPhoto')}</label>
    <input id="sPic" class="inp" type="file" accept="image/*" onchange="statPicPicked()">
    <div id="sPicOk"></div>

    <p class="err" id="sErr"></p>
    <div class="btnrow"><button class="btn wa" onclick="sendStatRequest()">🟢 ${t('sendReq')}</button></div>
  `, redraw);
}
function statPicPicked(){
  if (!$('#sPic').files.length) return;
  $('#sPicOk').innerHTML = attachAlert();
}
function sendStatRequest(){
  const n = $('#sName').value.trim(), p = $('#sPhone').value.trim(), list = $('#sList').value.trim();
  const hasPhoto = $('#sPic').files.length > 0;
  const err = $('#sErr');
  if (!n || !p){ err.textContent = t('eFill'); return; }
  if (!/^[0-9]{10}$/.test(p)){ err.textContent = t('ePhone'); return; }
  if (!list && !hasPhoto){ err.textContent = t('eListOrPhoto'); return; }
  err.textContent = '';

  const lines = [
    '🧾 ' + t('reqTitle'),
    `${t('yourName')}: ${n}`,
    `${t('phone')}: ${p}`
  ];
  if (list) lines.push(`${t('itemsList')}: ${list}`);
  if (hasPhoto) lines.push(t('photoAttached'));
  window.open('https://wa.me/' + statReqPhone + '?text=' + encodeURIComponent(lines.join('\n')), '_blank');
}

function attachAlert(){
  return `
    <div class="ok">${t('prescOk')}</div>
    <div class="alert">
      <div class="ah"><span class="clip">📎</span><b>${t('prescHead')}</b></div>
      <ol>
        <li><b>${t('prescStep1')}</b></li>
        <li><b>${t('prescStep2')}</b></li>
      </ol>
      <div class="warn">${t('prescWarn')}</div>
      <button type="button" class="copybtn" onclick="copyReminder(this)">📋 ${t('copyNote')}</button>
    </div>`;
}
function picPicked(){
  if (!$('#mPic').files.length) return;
  $('#picOk').innerHTML = attachAlert();
}
function copyReminder(btn){
  const text = `${t('prescStep1')}. ${t('prescStep2')}.`;
  const done = () => { btn.textContent = '✓ ' + t('copied'); setTimeout(() => btn.innerHTML = `📋 ${t('copyNote')}`, 1800); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(done);
  else done();
}
function sendMedicine(){
  const n = $('#mName').value.trim(), a = $('#mAge').value.trim(),
        is = $('#mIssue').value.trim(), m = $('#mMed').value.trim(),
        err = $('#mErr');
  if (!n || !a || !is || !m){ err.textContent = t('eFill'); return; }
  if (!/^[0-9]{1,3}$/.test(a)){ err.textContent = t('eAge'); return; }
  err.textContent = '';

  const lines = [
    '💊 ' + t('medTitle'),
    `${t('yourName')}: ${n}`,
    `${t('age')}: ${a}`,
    `${t('issue')}: ${is}`,
    `${t('medName')}: ${m}`,
    `🏥 ${L(medCtx)}`
  ];
  window.open('https://wa.me/' + (medCtx.medPhone || medCtx.phone) + '?text=' + encodeURIComponent(lines.join('\n')), '_blank');
}

/* =====================================================================
   12. PRODUCE — vegetables & fruits (Supabase)
   ===================================================================== */
function rowToProduce(r){
  return {
    kn: r.name_kn, en: r.name_en, e: r.emoji,
    farmer: { kn: r.farmer_kn, en: r.farmer_en },
    loc: r.village, img: r.img || '', phone: r.phone
  };
}

async function loadProduce(){
  try{
    const { data, error } = await sb
      .from('produce')
      .select('*')
      .eq('active', true)
      .order('created_at', { ascending: true });
    if (error) throw error;
    const rows = data || [];
    VEG = rows.filter(r => r.type === 'veg').map(rowToProduce);
    FRUIT = rows.filter(r => r.type === 'fruit').map(rowToProduce);
  } catch (e){
    console.error('Failed to load produce:', e);
    VEG = []; FRUIT = [];
  }
  renderAll();
  onSearch();
}

/* =====================================================================
   13. NOTICES (Supabase)
   ===================================================================== */
let noticesCache = [];

async function loadNotices(){
  try{
    const { data, error } = await sb
      .from('notices')
      .select('*')
      .eq('active', true)
      .order('created_at', { ascending: false });
    if (error) throw error;
    noticesCache = data || [];
  } catch (e){
    console.error('Failed to load notices:', e);
    noticesCache = [];
  }
  renderNotices();
}

function renderNotices(){
  const el = $('#noticesList');
  if (!el) return; // section not in the DOM yet
  if (!noticesCache.length){
    el.innerHTML = `<div class="empty">${t('noticesEmpty')}</div>`;
    return;
  }
  el.innerHTML = noticesCache.map(noticeCard).join('');
}

function noticeCard(n){
  const title = lang === 'kn' ? n.title_kn : n.title_en;
  const body  = lang === 'kn' ? n.body_kn  : n.body_en;
  const date  = new Date(n.created_at).toLocaleDateString(
    lang === 'kn' ? 'kn-IN' : 'en-IN',
    { day: 'numeric', month: 'short', year: 'numeric' }
  );
  return `<div class="notice">
    <div class="ndate">📅 ${esc(date)}</div>
    <b>${esc(title)}</b>
    <p>${esc(body)}</p>
  </div>`;
}

   11. BOOT

buildNav();
buildLocations();

renderAll();
setLang('kn');
startHero();
loadNotices();
loadProduce();
