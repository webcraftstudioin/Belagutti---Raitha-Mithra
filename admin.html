<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belagutti Market – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16231d; --ink-soft:#5d6d64; --paper:#fbf8f0; --card:#ffffff;
  --leaf:#1f6b4a; --turmeric:#f0a81b; --chilli:#c4382c; --line:#e6e1d4;
  --radius:14px; --shadow:0 4px 18px rgba(22,35,29,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
header{background:var(--leaf);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:17px}
header button{background:rgba(255,255,255,.16);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:18px;margin:0 0 4px}
.sub{color:var(--ink-soft);font-size:13px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
label{display:block;font-size:12.5px;color:var(--ink-soft);margin:12px 0 5px;font-weight:500}
label:first-child{margin-top:0}
input,textarea{
  width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fdfcf8;
  font:inherit;color:var(--ink);
}
input:focus,textarea:focus{outline:none;border-color:var(--leaf);background:#fff}
textarea{resize:vertical}
button.btn{
  padding:12px 18px;border-radius:10px;border:none;font-weight:600;font-size:14px;cursor:pointer;margin-top:14px;
}
.btn.primary{background:var(--leaf);color:#fff}
.btn.danger{background:#fff;color:var(--chilli);border:1.5px solid var(--chilli)}
.btn.ghost{background:#f2efe6;color:var(--ink)}
.err{color:var(--chilli);font-size:13px;margin-top:10px;min-height:16px}
.ok{background:#f1f8f4;border:1px solid #cfe4d8;color:#15533a;font-size:13px;padding:9px 11px;border-radius:8px;margin-top:10px}
.notice-item{border-bottom:1px solid var(--line);padding:14px 0}
.notice-item:last-child{border-bottom:none}
.notice-item b{font-size:14.5px}
.notice-item .meta{font-size:12px;color:var(--ink-soft);margin:3px 0 8px}
.notice-item p{margin:0 0 10px;font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{margin-top:0;padding:8px 13px;font-size:12.5px}
.hidden{display:none}
.badge{font-size:11px;background:#fdecc8;color:#8a5a12;padding:2px 8px;border-radius:999px;font-weight:600}
</style>
</head>
<body>

<header>
  <b>🌾 Belagutti Market — Admin</b>
  <button id="logoutBtn" class="hidden" onclick="logout()">Log out</button>
</header>

<main>
  <!-- LOGIN -->
  <div id="loginView" class="card">
    <h2>Admin login</h2>
    <p class="sub">Only your Supabase admin account can post notices.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <p class="err" id="loginErr"></p>
    <button class="btn primary" onclick="login()">Log in</button>
  </div>

  <!-- ADMIN PANEL -->
  <div id="panelView" class="hidden">
    <div class="card">
      <h2 id="formTitle">Post a new notice</h2>
      <p class="sub">Fill in both languages so everyone can read it.</p>

      <label for="titleKn">Title (Kannada)</label>
      <input id="titleKn" placeholder="ಶೀರ್ಷಿಕೆ">
      <label for="titleEn">Title (English)</label>
      <input id="titleEn" placeholder="Title">
      <label for="bodyKn">Message (Kannada)</label>
      <textarea id="bodyKn" rows="3" placeholder="ವಿವರ"></textarea>
      <label for="bodyEn">Message (English)</label>
      <textarea id="bodyEn" rows="3" placeholder="Details"></textarea>

      <p class="err" id="formErr"></p>
      <div class="row">
        <button class="btn primary" onclick="saveNotice()">Post notice</button>
        <button class="btn ghost hidden" id="cancelEditBtn" onclick="cancelEdit()">Cancel edit</button>
      </div>
    </div>

    <div class="card">
      <h2>Existing notices</h2>
      <p class="sub">Newest first. Inactive notices are hidden from the public site.</p>
      <div id="noticeList"><p class="sub">Loading…</p></div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://yzffffubsskcjmulxpir.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6ZmZmZnVic3NrY2ptdWx4cGlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MzEwNzAsImV4cCI6MjEwNTMwNzA3MH0._XP5FN_9kseg0A3neJUCbVjD4XeeCU5CuN7w_ZYtOX8';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let editingId = null;

/* ---------- Auth ---------- */
async function checkSession(){
  const { data } = await sb.auth.getSession();
  if (data.session){
    showPanel();
  } else {
    showLogin();
  }
}

function showLogin(){
  $('#loginView').classList.remove('hidden');
  $('#panelView').classList.add('hidden');
  $('#logoutBtn').classList.add('hidden');
}
function showPanel(){
  $('#loginView').classList.add('hidden');
  $('#panelView').classList.remove('hidden');
  $('#logoutBtn').classList.remove('hidden');
  loadNotices();
}

async function login(){
  const email = $('#email').value.trim();
  const password = $('#password').value;
  const err = $('#loginErr');
  err.textContent = '';
  if (!email || !password){ err.textContent = 'Enter email and password.'; return; }

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ err.textContent = error.message; return; }
  showPanel();
}

async function logout(){
  await sb.auth.signOut();
  showLogin();
}

/* ---------- Notices CRUD ---------- */
async function loadNotices(){
  const el = $('#noticeList');
  el.innerHTML = '<p class="sub">Loading…</p>';
  const { data, error } = await sb
    .from('notices')
    .select('*')
    .order('created_at', { ascending: false });

  if (error){
    el.innerHTML = `<p class="err">Could not load notices: ${esc(error.message)}</p>`;
    return;
  }
  if (!data.length){
    el.innerHTML = '<p class="sub">No notices yet. Post your first one above.</p>';
    return;
  }
  el.innerHTML = data.map(rowHtml).join('');
}

function rowHtml(n){
  const date = new Date(n.created_at).toLocaleString('en-IN', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  return `<div class="notice-item">
    <b>${esc(n.title_en)}</b> ${n.active ? '' : '<span class="badge">Hidden</span>'}
    <div class="meta">${esc(date)} · ${esc(n.title_kn)}</div>
    <p>${esc(n.body_en)}</p>
    <div class="row">
      <button class="btn ghost" onclick="editNotice('${n.id}')">Edit</button>
      <button class="btn ghost" onclick="toggleActive('${n.id}', ${n.active})">${n.active ? 'Hide' : 'Show'}</button>
      <button class="btn danger" onclick="deleteNotice('${n.id}')">Delete</button>
    </div>
  </div>`;
}

async function saveNotice(){
  const titleKn = $('#titleKn').value.trim();
  const titleEn = $('#titleEn').value.trim();
  const bodyKn = $('#bodyKn').value.trim();
  const bodyEn = $('#bodyEn').value.trim();
  const err = $('#formErr');
  err.textContent = '';

  if (!titleKn || !titleEn || !bodyKn || !bodyEn){
    err.textContent = 'Please fill in all four fields.';
    return;
  }

  if (editingId){
    const { error } = await sb.from('notices')
      .update({ title_kn: titleKn, title_en: titleEn, body_kn: bodyKn, body_en: bodyEn })
      .eq('id', editingId);
    if (error){ err.textContent = error.message; return; }
  } else {
    const { error } = await sb.from('notices')
      .insert({ title_kn: titleKn, title_en: titleEn, body_kn: bodyKn, body_en: bodyEn, active: true });
    if (error){ err.textContent = error.message; return; }
  }

  clearForm();
  loadNotices();
}

async function editNotice(id){
  const { data, error } = await sb.from('notices').select('*').eq('id', id).single();
  if (error){ $('#formErr').textContent = error.message; return; }
  editingId = id;
  $('#titleKn').value = data.title_kn;
  $('#titleEn').value = data.title_en;
  $('#bodyKn').value = data.body_kn;
  $('#bodyEn').value = data.body_en;
  $('#formTitle').textContent = 'Edit notice';
  $('#cancelEditBtn').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit(){ clearForm(); }

function clearForm(){
  editingId = null;
  $('#titleKn').value = '';
  $('#titleEn').value = '';
  $('#bodyKn').value = '';
  $('#bodyEn').value = '';
  $('#formErr').textContent = '';
  $('#formTitle').textContent = 'Post a new notice';
  $('#cancelEditBtn').classList.add('hidden');
}

async function toggleActive(id, isActive){
  const { error } = await sb.from('notices').update({ active: !isActive }).eq('id', id);
  if (error){ alert(error.message); return; }
  loadNotices();
}

async function deleteNotice(id){
  if (!confirm('Delete this notice permanently?')) return;
  const { error } = await sb.from('notices').delete().eq('id', id);
  if (error){ alert(error.message); return; }
  loadNotices();
}

checkSession();
</script>
</body>
</html>
